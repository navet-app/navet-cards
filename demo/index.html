<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navet Cards · Preview</title>
  <style>
    :root { color-scheme:dark; --primary-text-color:#eef0f4; --secondary-text-color:#a4abb8; --card-background-color:#20242d; --ha-card-background:#20242d; --divider-color:#424753; --primary-color:#ea8c55; }
    body { margin:0; background:#16191f; color:var(--primary-text-color); font:14px Inter,system-ui,sans-serif; }
    main { max-width:1126px; margin:0 auto; padding:32px 24px 60px; } header { display:flex; gap:20px; align-items:center; justify-content:space-between; margin-bottom:28px; }
    h1 { margin:0 0 7px; font-size:24px; font-weight:600; letter-spacing:-.035em; } h2 { font-size:14px; font-weight:550; margin:0 0 14px; color:var(--secondary-text-color); }
    p { color:var(--secondary-text-color); margin:0; line-height:1.5; } .toolbar { display:flex; gap:8px; flex-wrap:wrap; } button,select { background:var(--card-background-color); color:inherit; border:1px solid var(--divider-color); padding:9px 13px; border-radius:100px; font:inherit; cursor:pointer; }
    .grid { display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); grid-auto-rows:minmax(176px,auto); gap:14px; align-items:start; margin-bottom:30px; }
    .grid > * { grid-column:span 4; height:176px; } .grid > :is(navet-switch-card,navet-lock-card,navet-person-card,navet-scene-card,navet-script-card,navet-button-card) { grid-column:span 2; }
    .grid > navet-chips-card, .grid > navet-sub-controls-card { height:auto; align-self:start; }
    .grid > navet-switch-card[data-size='extra-small'] { height:88px; }
    .section { display:contents; } .built-in { border:1px solid var(--divider-color); border-radius:12px; padding:18px; background:var(--card-background-color); min-height:130px; display:flex; flex-direction:column; gap:8px; }
    #events { min-height:25px; font-size:12px; margin-top:20px; } #editor-panel { max-width:520px; margin-top:24px; padding:24px; background:var(--card-background-color); border-radius:24px; }
    .light { color-scheme:light; --primary-text-color:#20242d; --secondary-text-color:#657080; --card-background-color:#fff; --ha-card-background:#fff; --divider-color:#d7dce3; background:#f2f4f6; }
    @media(max-width:700px) { .grid { grid-template-columns:repeat(4,minmax(0,1fr)); } .grid > * { grid-column:span 4; height:176px; } .grid > :is(navet-switch-card,navet-lock-card,navet-person-card,navet-scene-card,navet-script-card,navet-button-card) { grid-column:span 2; } header { align-items:flex-start; flex-direction:column; } }
    @media(max-width:380px) { main { padding:24px 12px; } }
  </style>
</head>
<body><main>
  <header><div><h1>Navet Cards</h1><p>Independent cards for your Home Assistant dashboard.</p></div><div class="toolbar"><button id="switch-size">Extra-small switch</button><button id="theme">Light theme</button><button id="unavailable">Unavailable state</button><button id="fail">Fail next action</button></div></header>
  <p><a href="./composition.html" style="color:inherit">Try room controls and composition</a></p><h2>Kitchen</h2><div class="grid" id="cards"></div>
  <h2>More entities and custom cards</h2><div class="grid" id="catalog"></div>
  <p>This preview uses simulated Home Assistant state. It does not control your home.</p>
  <p id="events" role="status">Try a control, then open the room.</p>
  <details id="editor-panel"><summary>Edit the kitchen light</summary><navet-card-editor id="editor"></navet-card-editor></details>
</main>
<script type="module">
  import '../dist/navet-cards.js';
  class DemoIcon extends HTMLElement {
    set icon(value) { this.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="'+({ 'mdi:power-plug-outline':'M8 3v5m8-5v5M6 8h12v3a6 6 0 0 1-5 6v4h-2v-4a6 6 0 0 1-5-6z', 'mdi:gauge':'M4 18a9 9 0 1 1 16 0M12 13l4-5M5 18h14', 'mdi:sofa-outline':'M5 12V8a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v4M3 11v7h18v-7M5 18v3m14-3v3M6 14h12', 'mdi:speaker':'M6 3h12v18H6zM12 7h.01M12 12a3 3 0 1 0 0 6 3 3 0 0 0 0-6', 'mdi:thermostat':'M9 14V5a3 3 0 0 1 6 0v9a5 5 0 1 1-6 0M12 8v10', 'mdi:blinds-horizontal':'M3 4h18M4 4v15h16V4M4 9h16M4 14h16M12 19v3' }[value]??'M9 18h6m-5 3h4M8 14c-5-5-1-11 4-11s9 6 4 11l-1 2H9z')+'"/></svg>'; }
  }
  if(!customElements.get('ha-icon')) customElements.define('ha-icon',DemoIcon);
  const state=(id,value,attributes)=>({ entity_id:id,state:value,attributes });
  const states={
    'light.kitchen':state('light.kitchen','on',{ friendly_name:'Kitchen lights',brightness:166,supported_color_modes:['brightness'] }),
    'update.demo_firmware':state('update.demo_firmware','on',{friendly_name:'Demo firmware',supported_features:5,installed_version:'1.0',latest_version:'1.1',in_progress:false,auto_update:false,release_summary:'Simulated update entity; controls use the demo host.'}),
    'remote.living_room':state('remote.living_room','on',{friendly_name:'Living room remote',supported_features:4,activity_list:['Watch TV','Listen to music'],current_activity:'Watch TV'}),
    'humidifier.bedroom':state('humidifier.bedroom','on',{friendly_name:'Bedroom humidifier',supported_features:1,humidity:45,current_humidity:39,min_humidity:30,max_humidity:80,available_modes:['normal','eco'],mode:'normal'}),
    'calendar.family':state('calendar.family','off',{friendly_name:'Family calendar'}),
    'water_heater.home':state('water_heater.home','eco',{friendly_name:'Hot water',supported_features:15,temperature:52,current_temperature:49,min_temp:40,max_temp:70,operation_list:['off','eco','electric'],operation_mode:'eco',away_mode:'off'}),
    'switch.coffee':state('switch.coffee','off',{ friendly_name:'Coffee machine' }),
    'sensor.temperature':state('sensor.temperature','21.4',{ friendly_name:'Kitchen temperature',unit_of_measurement:'°C' }),
    'media_player.kitchen':state('media_player.kitchen','playing',{ friendly_name:'Kitchen speaker',media_title:'Morning radio',supported_features:16389,volume_level:.35 }),
    'climate.kitchen':state('climate.kitchen','heat',{ friendly_name:'Kitchen heating',supported_features:1,temperature:22,current_temperature:21.4,min_temp:7,max_temp:30,target_temp_step:.5 }),
    'cover.kitchen':state('cover.kitchen','open',{ friendly_name:'Kitchen blinds',supported_features:15,current_position:75 }),
    'sensor.missing':undefined,
  };
  let fail=false;
  window.calls=[];
  const report=message=>document.querySelector('#events').textContent=message;
  window.demoHass={ states,language:'en',themes:{darkMode:true},config:{unit_system:{temperature:'°C'}},areas:{kitchen:{name:'Kitchen'}},entities:Object.fromEntries(Object.keys(states).filter(id=>states[id]).map(id=>[id,{area_id:'kitchen'}])),devices:{},
    async callService(domain,service,data,target) {
      if(fail) { fail=false; throw new Error('The device did not respond. Try again.'); }
      window.calls.push({domain,service,data,target});
      const id=target?.entity_id??data?.entity_id;
      if(!window.demoHass.states[id]) return;
      const old=window.demoHass.states[id];
      let value=old.state; const attributes={...old.attributes};
      if(service==='turn_on') value=domain==='scene'?new Date().toISOString():'on'; if(service==='turn_off') value='off';
      if(service==='lock') value='locked'; if(service==='unlock') value='unlocked';
      if(service==='start') value='cleaning'; if(service==='return_to_base') value='returning';
      if(service==='pause') value='paused'; if(service==='set_value') value=data.value;
      if(service==='select_option') value=data.option;
      if(data.percentage!==undefined) attributes.percentage=data.percentage;
      if(data.brightness_pct!==undefined) attributes.brightness=Math.round(data.brightness_pct*255/100);
      if(service==='media_pause') value='paused'; if(service==='media_play') value='playing';
      if(data.volume_level!==undefined) attributes.volume_level=data.volume_level;
      if(data.temperature!==undefined) attributes.temperature=data.temperature;
      if(service==='open_cover') {value='open';attributes.current_position=100;} if(service==='close_cover') {value='closed';attributes.current_position=0;}
      if(data.position!==undefined) {attributes.current_position=data.position;value=data.position===0?'closed':'open';}
      window.demoHass={...window.demoHass,states:{...window.demoHass.states,[id]:{...old,state:value,attributes}}}; window.syncCards();
      report(`${service.replaceAll('_',' ')} · ${old.attributes.friendly_name}`);
    }
  };
  window.demoHass.callWS=async message=>({response:{[message.target.entity_id]:{forecast:Array.from({length:7},(_,i)=>({datetime:new Date(Date.now()+i*86400000).toISOString(),condition:i%3===0?'sunny':i%3===1?'cloudy':'rainy',temperature:18+i%4,templow:10+i%3}))}}});
  window.demoHass.callApi=async(method,path)=>path?.startsWith('calendars/')?[{summary:'Simulated family event',start:{dateTime:new Date(Date.now()+3600000).toISOString()},end:{dateTime:new Date(Date.now()+7200000).toISOString()},location:'Demo home'}]:[Array.from({length:25},(_,i)=>({last_changed:new Date(Date.now()-(24-i)*3600000).toISOString(),state:String([320,360,420,390,280,250,210,390,780,840,690,460,480,710,560,490,410,600,620,590,650,520,490,460,420][i])}))];
  window.configs=[
    {type:'custom:navet-light-card',entity:'light.kitchen',tap_action:{action:'toggle'},hold_action:{action:'more-info'}},
    {type:'custom:navet-switch-card',entity:'switch.coffee'},
    {type:'custom:navet-sensor-card',entity:'sensor.temperature'},
    {type:'custom:navet-room-card',area:'kitchen'},
    {type:'custom:navet-media-card',entity:'media_player.kitchen'},
    {type:'custom:navet-climate-card',entity:'climate.kitchen'},
    {type:'custom:navet-cover-card',entity:'cover.kitchen'},
  ];
  window.cards=window.configs.map(config=>{const card=document.createElement(config.type.replace('custom:',''));card.setConfig(config);document.querySelector('#cards').append(card);return card;});
  window.cards[1].id='kitchen-switch';
  window.smallExample=document.createElement('navet-switch-card');
  window.smallExample.id='small-example';
  window.smallExample.setConfig({type:'custom:navet-switch-card',entity:'switch.coffee',name:'Small · 1×1',size:'small'});
  window.cards[1].after(window.smallExample);
  const additions = {
    'input_number.watering':state('input_number.watering','15',{friendly_name:'Watering duration',min:1,max:60,step:1,unit_of_measurement:'min'}),
    'input_select.house':state('input_select.house','Home',{friendly_name:'House mode',options:['Home','Away','Night']}),
    'fan.office':state('fan.office','on',{friendly_name:'Office fan',supported_features:49,percentage:40}),
    'lock.front':state('lock.front','locked',{friendly_name:'Front door'}),
    'vacuum.robot':state('vacuum.robot','docked',{friendly_name:'Robot vacuum',supported_features:8220,battery_level:86,cleaned_area:42,cleaning_time:28}),
    'person.alex':state('person.alex','home',{friendly_name:'Alex'}),
    'weather.home':state('weather.home','sunny',{friendly_name:'Home weather',temperature:18,temperature_unit:'°C',humidity:62,apparent_temperature:17,supported_features:1}),
    'scene.evening':state('scene.evening','unknown',{friendly_name:'Evening'}),
    'script.goodnight':state('script.goodnight','off',{friendly_name:'Good night'}),
    'input_text.note':state('input_text.note','Remember to water the plants.\nCoffee beans are in the pantry.',{friendly_name:'Kitchen note',min:0,max:255}),
    'sensor.battery':state('sensor.battery','18',{friendly_name:'Door sensor',unit_of_measurement:'%',device_class:'battery'}),
    'sensor.battery_two':state('sensor.battery_two','78',{friendly_name:'Motion sensor',unit_of_measurement:'%',device_class:'battery'}),
    'sensor.power':state('sensor.power','420',{friendly_name:'Current load',unit_of_measurement:'W',device_class:'power'}),
    'sensor.energy':state('sensor.energy','3.8',{friendly_name:'Today',unit_of_measurement:'kWh',device_class:'energy'}),
    'sensor.ups_status':state('sensor.ups_status','Online',{friendly_name:'Status'}),
    'sensor.ups_battery':state('sensor.ups_battery','92',{friendly_name:'Battery',unit_of_measurement:'%'}),
    'sensor.ups_runtime':state('sensor.ups_runtime','54',{friendly_name:'Runtime',unit_of_measurement:'min'}),
    'sensor.ups_load':state('sensor.ups_load','24',{friendly_name:'Load',unit_of_measurement:'%'}),
  };
  window.demoHass={...window.demoHass,states:{...window.demoHass.states,...additions},entities:{...window.demoHass.entities,'scene.evening':{area_id:'kitchen'}}};
  const moreConfigs = [
    {type:'custom:navet-fan-card',entity:'fan.office'},
    {type:'custom:navet-lock-card',entity:'lock.front'},
    {type:'custom:navet-vacuum-card',entity:'vacuum.robot'},
    {type:'custom:navet-person-card',entity:'person.alex'},
    {type:'custom:navet-weather-card',entity:'weather.home'},
    {type:'custom:navet-scene-card',entity:'scene.evening'},
    {type:'custom:navet-script-card',entity:'script.goodnight'},
    {type:'custom:navet-entity-card',entity:'sensor.power',name:'Generic entity'},
    {type:'custom:navet-info-card',name:'Kitchen readings',entities:['sensor.temperature','sensor.power']},
    {type:'custom:navet-note-card',entity:'input_text.note'},
    {type:'custom:navet-photo-card',name:'A quiet moment',image:'/demo/landscape.svg',alt:'Illustrated hills at sunset'},
    {type:'custom:navet-button-card',name:'Evening routine',entity:'scene.evening'},
    {type:'custom:navet-battery-card',name:'Batteries',entities:['sensor.battery','sensor.battery_two']},
    {type:'custom:navet-ups-card',name:'Office UPS',entities:['sensor.ups_status','sensor.ups_load','sensor.ups_battery','sensor.ups_runtime']},
    {type:'custom:navet-energy-now-card',name:'Energy now',entities:['sensor.power','sensor.energy']},
    {type:'custom:navet-media-stack-card',name:'Speakers',entities:['media_player.kitchen']},
    {type:'custom:navet-number-card',entity:'input_number.watering'},
    {type:'custom:navet-select-card',entity:'input_select.house'},
    {type:'custom:navet-chips-card',title:'At a glance',chips:[{id:'temperature',entity:'sensor.temperature',name:'Kitchen'},{id:'weather',entity:'weather.home'},{id:'home',name:'Home',icon:'mdi:home',tap_action:{action:'navigate',navigation_path:'/demo/index.html'}}]},
    {type:'custom:navet-sub-controls-card',name:'Quick controls',sub_controls:[{entity:'sensor.temperature',name:'Kitchen',control:'state',read_only:true},{entity:'switch.coffee',name:'Coffee',control:'toggle'}]},
    {type:'custom:navet-composition-card',name:'Reusable composition',definitions:{reading:{config:{type:'custom:navet-sensor-card',entity:'sensor.temperature'}}},cards:[]},
    {type:'custom:navet-calendar-card',calendar:{entities:['calendar.family']}},
    {type:'custom:navet-update-card',entity:'update.demo_firmware'},
    {type:'custom:navet-remote-card',entity:'remote.living_room'},
    {type:'custom:navet-humidifier-card',entity:'humidifier.bedroom'},
    {type:'custom:navet-water-heater-card',entity:'water_heater.home'},
    {type:'custom:navet-navigation-card',name:'Rooms',links:[{name:'Kitchen',path:'#kitchen'},{name:'Home',path:'/demo/index.html'}]},
  ];
  window.catalogCards=moreConfigs.map(config=>{const card=document.createElement(config.type.replace('custom:',''));card.setConfig(config);document.querySelector('#catalog').append(card);return card;});
  window.syncCards=()=>{[...window.cards,window.smallExample,...window.catalogCards].forEach(card=>card.hass=window.demoHass);document.querySelector('#editor').hass=window.demoHass;}; window.syncCards();
  document.querySelector('#switch-size').onclick=()=>{const extra=window.configs[1].size!=='extra-small';window.configs[1]={...window.configs[1],size:extra?'extra-small':'small'};window.cards[1].setConfig(window.configs[1]);document.querySelector('#switch-size').textContent=extra?'Small switch':'Extra-small switch';};
  const editor=document.querySelector('#editor');editor.setConfig(window.configs[0]);
  editor.addEventListener('config-changed',e=>{window.cards[0].setConfig(e.detail.config);window.configs[0]=e.detail.config;});
  document.addEventListener('hass-more-info',e=>report(`More info · ${e.detail.entityId}`));
  document.querySelector('#theme').onclick=()=>{const light=document.body.classList.toggle('light');window.demoHass={...window.demoHass,themes:{darkMode:!light}};window.syncCards();document.querySelector('#theme').textContent=light?'Dark theme':'Light theme';};
  document.querySelector('#unavailable').onclick=()=>{const entity=window.demoHass.states['light.kitchen'];window.demoHass={...window.demoHass,states:{...window.demoHass.states,'light.kitchen':{...entity,state:entity.state==='unavailable'?'on':'unavailable'}}};window.syncCards();};
  document.querySelector('#fail').onclick=()=>{fail=true;report('Next action will fail.');};
</script></body></html>
